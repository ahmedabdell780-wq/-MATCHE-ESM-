}
function standings(){
 const t={};Object.keys(T).forEach(i=>t[i]={id:+i,p:0,w:0,d:0,l:0,f:0,a:0,pts:0});
 for(let r=1;r<=22;r++)pairs(r).m.forEach(([h,a])=>{
  const v=S[K(cat,r,h,a)];if(!v||v.status!=='confirmed'||v.sh===''||v.sh==null)return;
  const x=+v.sh,y=+v.sa,H=t[h],A=t[a];H.p++;A.p++;H.f+=x;H.a+=y;A.f+=y;A.a+=x;
  if(x>y){H.w++;A.l++;H.pts+=3}else if(x<y){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}});

 const rows=Object.values(t).sort((a,b)=>b.pts-a.pts||(b.f-b.a)-(a.f-a.a)||b.f-a.f||a.id-b.id);

 // معرفة آخر جولة ملعوبة
 let lastRound = 1;
 for(let r=1;r<=22;r++){
   if(pairs(r).m.some(([h,a])=>{const v=S[K(cat,r,h,a)];return v&&v.status==='confirmed'&&v.sh!=='';})){
     lastRound = r;
   }
 }

 // حساب الإحصاءات العامة
 let totalGoals = 0, totalMatches = 0;
 let maxGF = -1, topAttTeam = 'وفاق حجوط';
 let minGA = 9999, topDefTeam = 'وفاق حجوط';

 rows.forEach(r => {
   if(r.p > 0){
     if(r.f > maxGF){ maxGF = r.f; topAttTeam = T[r.id]; }
     if(r.a < minGA){ minGA = r.a; topDefTeam = T[r.id]; }
   }
   totalGoals += r.f;
 });

 for(let r=1;r<=22;r++){
   pairs(r).m.forEach(([h,a])=>{
     const v=S[K(cat,r,h,a)];
     if(v && v.status==='confirmed' && v.sh!=='' && v.sh!=null) totalMatches++;
   });
 }
 const matchGoals = Math.round(totalGoals / 2);
 const avgGoals = totalMatches > 0 ? (matchGoals / totalMatches).toFixed(2) : '0.00';
 if(maxGF < 0) maxGF = 0;
 if(minGA === 9999) minGA = 0;

 // آخر 5 مباريات لكل نادٍ
 const formOf = (tId) => {
   const resList = [];
   for(let r=1; r<=lastRound; r++){
     pairs(r).m.forEach(([h,a])=>{
       if(h != tId && a != tId) return;
       const v = S[K(cat, r, h, a)];
       if(!v || v.status !== 'confirmed' || v.sh === '' || v.sh == null) return;
       const my = (h == tId ? +v.sh : +v.sa);
       const op = (h == tId ? +v.sa : +v.sh);
       resList.push(my > op ? 'W' : (my < op ? 'L' : 'D'));
     });
   }
   return resList.slice(-5);
 };

 const formHtml = (fList) => {
   const dot = x => x === 'W'
     ? '<span style="background:#16a34a;color:#fff;border-radius:4px;padding:1px 4px;font-size:10px;font-weight:800;display:inline-block;min-width:14px;text-align:center;">ف</span>'
     : (x === 'L'
       ? '<span style="background:#dc2626;color:#fff;border-radius:4px;padding:1px 4px;font-size:10px;font-weight:800;display:inline-block;min-width:14px;text-align:center;">خ</span>'
       : '<span style="background:#475569;color:#fff;border-radius:4px;padding:1px 4px;font-size:10px;font-weight:800;display:inline-block;min-width:14px;text-align:center;">ت</span>');
   let h = '';
   for(let i=0; i<5; i++){
     if(i < fList.length) h += dot(fList[i]);
     else h += '<span style="background:#e2e8f0;border-radius:4px;display:inline-block;width:14px;height:14px;vertical-align:middle;"></span>';
   }
   return `<span style="display:inline-flex;gap:2px;align-items:center;justify-content:center;">${h}</span>`;
 };

 return chips() + `
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
   <span style="font-size:13px;font-weight:800;color:var(--g);">🏆 الترتيب الرسمي المعتمد · ${cat}</span>
   <button class="btn sm" id="btnDlPoster" onclick="downloadStandingsPoster()" style="display:inline-flex;align-items:center;gap:4px;background:#16a34a;">
     📷 تحميل الملصق كصورة HD
   </button>
 </div>

 <div class="poster-card" id="standingsPosterBox">
   <div class="poster-hdr">
     <div class="poster-hdr-rt">
       <img src="icon-192.png" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:1.5px solid var(--g);" alt="شعار الرابطة">
       <div>
         <h2 class="poster-title">رابطة تيبازة لكرة القدم</h2>
         <div class="poster-sub">الفئات الشبانية 2026/2027 · الفئة ${cat} (مجموعة وسط غرب)</div>
         <div style="font-size:11.5px;color:#64748b;font-weight:700;margin-top:1px;">الترتيب بعد الجولة ${lastRound}</div>
       </div>
     </div>
     <div class="poster-rnd-badge">
       <span>${lastRound}</span>
       <b>الترتيب</b>
     </div>
   </div>
   
   <div class="tbl-wrap">
     <table class="st-tbl">
       <thead>
         <tr>
           <th style="width:34px;">#</th>
           <th style="text-align:right;padding-right:8px;">الفريق</th>
           <th>لعب</th>
           <th>فاز</th>
           <th>تعادل</th>
           <th>خسر</th>
           <th>له</th>
           <th>عليه</th>
           <th>الفرق</th>
           <th style="width:96px;">الأداء</th>
           <th style="width:44px;">النقاط</th>
         </tr>
       </thead>
       <tbody>
         ${rows.map((r, i) => {
           const diff = r.f - r.a;
           const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
           const diffColor = diff > 0 ? '#16a34a' : (diff < 0 ? '#dc2626' : '#64748b');
           const rkClass = (i + 1) === 1 ? 'top' : ((i + 1) <= 8 ? 'mid' : 'bot');
           const fList = formOf(r.id);
           const logo = typeof teamLogoImg==='function'?teamLogoImg(r.id, 24):'';
           return `<tr>
             <td><span class="rk-pill ${rkClass}">${i + 1}</span></td>
             <td class="n">
               <div style="display:inline-flex;align-items:center;gap:6px;">
                 ${logo}
                 <span>${esc(T[r.id])}</span>
               </div>
             </td>
             <td><b>${r.p}</b></td>
             <td>${r.w}</td>
             <td>${r.d}</td>
             <td>${r.l}</td>
             <td>${r.f}</td>
             <td>${r.a}</td>
             <td dir="ltr" style="font-weight:800;color:${diffColor};">${diffStr}</td>
             <td>${formHtml(fList)}</td>
             <td style="font-size:15px;font-weight:900;color:var(--g);">${r.pts}</td>
           </tr>`;
         }).join('')}
       </tbody>
     </table>
   </div>

   <div class="stat-grid">
     <div class="stat-box">
       <div class="lbl">الهداف</div>
       <div class="val">0</div>
       <div class="sub">⚽ لا أهداف</div>
     </div>
     <div class="stat-box">
       <div class="lbl">أفضل هجوم</div>
       <div class="val" style="color:#16a34a;">${maxGF}</div>
       <div class="sub">${esc(topAttTeam)}</div>
     </div>
     <div class="stat-box">
       <div class="lbl">أفضل دفاع</div>
       <div class="val" style="color:#2563eb;">${minGA}</div>
       <div class="sub">${esc(topDefTeam)}</div>
     </div>
     <div class="stat-box">
       <div class="lbl">معدل الأهداف في المباراة</div>
       <div class="val" style="color:#d97706;">${avgGoals}</div>
       <div class="sub">${matchGoals} هدفاً · ${totalMatches} مباريات</div>
     </div>
   </div>

   <div class="legend-row">
     <span><i class="legend-box" style="background:#16a34a;"></i> الصعود / الصدارة</span>
     <span><i class="legend-box" style="background:#dc2626;"></i> منطقة السقوط</span>
     <span>(ف فوز · ت تعادل · خ خسارة - آخر 5 مباريات)</span>
   </div>

   <div class="poster-ftr">
     MOUBARATI LIVE · الترتيب الرسمي المعتمد · رابطة تيبازة
   </div>
 </div>
 `;
}

window.downloadStandingsPoster = async function() {
  const el = document.getElementById('standingsPosterBox');
  if (!el) return;
  toast('⏳ جاري إنشاء ملصق الترتيب...');
  try {
    if (typeof html2canvas === 'undefined') {
      alert('يرجى التأكد من اتصال الإنترنت لتحميل الصورة.');
      return;
    }
    const canvas = await html2canvas(el, {
      scale: 2.5,
      useCORS: true,
      backgroundColor: '#ffffff'
    });
    const link = document.createElement('a');
    link.download = `ترتيب_رابطة_تيبازة_${cat}_الجولة.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('✅ تم تنزيل ملصق الترتيب بنجاح!');
  } catch (e) {
    console.error(e);
    toast('⛔ تعذر إنشاء الصورة');
  }
};
function admin(){
 const row=u=>`<div class="card u"><div><b>${esc(u.name)}</b><br><small>${esc(T[u.teamId]||'')} · <a href="tel:${esc(u.phone)}">${esc(u.phone)}</a></small></div><div class="act" style="margin:0">${u.status!=='approved'?`<button class="btn sm" data-u="${u.id}" data-s="approved">✅ اعتماد</button>`:''}${u.status!=='suspended'?`<button class="btn sm red" data-u="${u.id}" data-s="suspended">⏸ ${u.status==='pending'?'رفض':'تجميد'}</button>`:''}</div></div>`;
 const pend=U.filter(u=>u.status==='pending'),oth=U.filter(u=>u.status!=='pending');
 return`<h2>⏳ بانتظار الموافقة (${pend.length})</h2>${pend.map(row).join('')||'<div class="card" style="color:var(--mu)">لا توجد طلبات</div>'}<h2>👥 الحسابات (${oth.length})</h2>${oth.map(row).join('')||'<div class="card" style="color:var(--mu)">لا توجد حسابات</div>'}<h2>🧰 أدوات</h2><div class="card"><button class="btn alt" id="seed" style="width:100%">استيراد نتائج الجولات 1-3 السابقة</button></div>`
}

/* ---- أحداث ---- */
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;round=firstOpen();draw()}
 else if(b.dataset.r){round=+b.dataset.r;draw()}
 else if(b.dataset.t){tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}
 else if(b.dataset.e)openEdit(b.dataset.e)
 else if(b.dataset.ok)setSt(b.dataset.ok,'confirmed')
 else if(b.dataset.no)setSt(b.dataset.no,'disputed')
 else if(b.dataset.u)try{await db.collection('users').doc(b.dataset.u).update({status:b.dataset.s})}catch(x){toast('⛔ تعذر التنفيذ')}
 else if(b.id==='seed')importSeed()
});
document.addEventListener('change',e=>{if(e.target.id==='rs'){round=+e.target.value;draw()}});
$('out').onclick=()=>auth.signOut();
$('tl').onclick=()=>{$('fl').hidden=false;$('fr').hidden=true;$('tl').setAttribute('aria-pressed',true);$('tr').setAttribute('aria-pressed',false)};
$('tr').onclick=()=>{$('fl').hidden=true;$('fr').hidden=false;$('tr').setAttribute('aria-pressed',true);$('tl').setAttribute('aria-pressed',false)};
$('bl').onclick=async()=>{say('le','');const m=mail($('lu').value),p=$('lp').value;if(!m||!p)return say('le','⚠️ أدخل رقم الهاتف وكلمة المرور');if(!auth)return;try{await auth.signInWithEmailAndPassword(m,p);$('lp').value=''}catch(x){say('le',errTxt(x))}};
$('lp').onkeydown=e=>{if(e.key==='Enter')$('bl').click()};
$('br').onclick=async()=>{
 say('re','');const n=$('rn').value.trim(),p=$('rp').value.trim(),w=$('rw').value;
 if(!n||ph(p).length<9)return say('re','⚠️ أدخل الاسم ورقم هاتف صحيحاً');
 if(w.length<6)return say('re','⚠️ كلمة المرور قصيرة');if(w!==$('rc').value)return say('re','⚠️ كلمتا المرور غير متطابقتين');
 if(!auth)return;reg=true;
 try{const c=await auth.createUserWithEmailAndPassword(ph(p)+'@esm.local',w);
  await db.collection('users').doc(c.user.uid).set({name:n,phone:p,teamId:+$('rt').value,role:'manager',status:'pending',perm:'full',date:new Date().toISOString().slice(0,10)});
  await auth.signOut();['rn','rp','rw','rc'].forEach(i=>$(i).value='');$('tl').click();say('le','✅ تم إرسال طلبك. بعد اعتماد المشرف يمكنك الدخول.')}
 catch(x){say('re',errTxt(x))}
 reg=false
};
function openEdit(k){
 const m=/^(?:([A-Z0-9]+)\|)?(\d+):(\d+)-(\d+)$/.exec(k);cur={k,h:+m[3],a:+m[4]};const v=S[k]||{};
 $('dt').textContent=T[cur.h]+' ضد '+T[cur.a];$('sh').value=v.sh??'';$('sa').value=v.sa??'';$('sd').value=v.date||'';$('dg').showModal()
}
$('dc').onclick=()=>$('dg').close();
$('ds').onclick=async()=>{
 const x=$('sh').value,y=$('sa').value;if(x===''||y===''||+x<0||+y<0)return toast('⚠️ أدخل نتيجة صحيحة');
 const adm=me.role==='admin',old=S[cur.k]||{};
 const data=Object.assign({},old,{sh:+x,sa:+y,date:$('sd').value,status:adm?'confirmed':'pending_confirm',enteredBy:adm?'admin':me.teamId});
 await put(cur.k,cur.h,cur.a,data);$('dg').close()
};
async function put(k,h,a,data){try{await db.collection('scores').doc(k.replace('|','_')).set({key:k,home:h,away:a,data,by:me.uid});toast('✅ تم الحفظ')}catch(e){toast('⛔ رُفض الحفظ: لا تملك الصلاحية')}}
function setSt(k,st){const m=/^(?:[A-Z0-9]+\|)?\d+:(\d+)-(\d+)$/.exec(k);put(k,+m[1],+m[2],Object.assign({},S[k],{status:st,confirmedBy:me.role==='admin'?'admin':me.teamId}))}
async function importSeed(){
 if(!confirm('استيراد '+Object.keys(SEED).length+' نتيجة (الجولات 1-3) كنتائج معتمدة؟'))return;
 const b=db.batch();
 Object.keys(SEED).forEach(k=>{const m=/^(?:[A-Z0-9]+\|)?\d+:(\d+)-(\d+)$/.exec(k),s=SEED[k];
  b.set(db.collection('scores').doc(k.replace('|','_')),{key:k,home:+m[1],away:+m[2],data:{sh:+s[0],sa:+s[1],date:s[2]||'',status:'confirmed',enteredBy:'admin'},by:me.uid})});
 try{await b.commit();toast('✅ تم الاستيراد')}catch(e){toast('⛔ فشل الاستيراد')}
}

const bguest = document.getElementById('bguest');
if(bguest) {
  bguest.onclick = () => {
    me = { role: 'guest', perm: 'view_only' };
    show();
  };
}

init();
</script>
