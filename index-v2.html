 p.m.forEach(([hm,aw])=>{
  const k=K(cat,round,hm,aw),v=S[k],has=v&&v.sh!==undefined&&v.sh!=='';
  h+=`<div class="card"><div class="m"><div class="tm">${lg(hm)}<span>${esc(T[hm])}</span></div><div class="sc ${has?'':'vs'}">${has?`<bdi dir="ltr">${v.sa} - ${v.sh}</bdi>`:'VS'}</div><div class="tm">${lg(aw)}<span>${esc(T[aw])}</span></div></div>
  <div class="meta"><span>📅 ${v&&v.date?esc(v.date):'التاريخ غير محدد'}</span>${has?stBadge(v):''}</div>
  <div class="act">${canEdit(hm,aw,v)?`<button class="btn sm" data-e="${k}">✏️ ${has?'تعديل':'إدخال'} النتيجة</button>`:''}${canConfirm(hm,aw,v)&&has?`<button class="btn sm" data-ok="${k}">✅ ${me.role==='admin'?'اعتماد':'تأكيد'}</button>${me.role!=='admin'?`<button class="btn sm red" data-no="${k}">❌ اعتراض</button>`:''}`:''}</div></div>`});
 return h+`<div class="bye">🛌 مستريحة: ${esc(T[p.bye])}</div>`
}
function results(){
 const p=pairs(round);let h=chips()+rnd()+`<button class="btn alt" data-shot="r" style="width:100%;margin-bottom:10px">📷 حفظ الجولة كصورة</button><div class="rh">نتائج الجولة ${round} · ${round<=11?'ذهاب':'إياب'} · ${cat}</div>`;
 p.m.forEach(([hm,aw])=>{const v=S[K(cat,round,hm,aw)],has=v&&v.sh!==undefined&&v.sh!=='';
  h+=`<div class="card rs"><div class="m"><div class="tm">${lg(hm)}<span>${esc(T[hm])}</span></div><div class="sc ${has?'':'vs'}">${has?`<bdi dir="ltr">${v.sa} - ${v.sh}</bdi>`:'VS'}</div><div class="tm">${lg(aw)}<span>${esc(T[aw])}</span></div></div>${has&&v.status!=='confirmed'?'<div class="meta" style="justify-content:center">'+stBadge(v)+'</div>':''}</div>`});
 return h+`<div class="bye">🛌 معفى من هذه الجولة: ${esc(T[p.bye])}</div>`
}
function tbl(c,up){
 const t={};Object.keys(T).forEach(i=>t[i]={id:+i,p:0,w:0,d:0,l:0,f:0,a:0,pts:0});
 for(let r=1;r<=up;r++)pairs(r).m.forEach(([h,a])=>{
  const v=S[K(c,r,h,a)];if(!v||v.status!=='confirmed'||v.sh===''||v.sh==null)return;
  const x=+v.sh,y=+v.sa,H=t[h],A=t[a];H.p++;A.p++;H.f+=x;H.a+=y;A.f+=y;A.a+=x;
  if(x>y){H.w++;A.l++;H.pts+=3}else if(x<y){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}});
 return Object.values(t).sort((a,b)=>b.pts-a.pts||(b.f-b.a)-(a.f-a.a)||b.f-a.f||a.id-b.id)
}
let up=0;
function standings(){
 if(!up)up=lastRound();const rows=tbl(cat,up),n=rows.length;
 const rc=i=>i==0?'g1':i==1?'g2':i==2?'g3':i>=n-3?'lo':'';
 return chips()+`<div class="rnd"><select id="us">${Array.from({length:22},(_,i)=>`<option value="${i+1}" ${i+1===up?'selected':''}>بعد الجولة ${i+1}</option>`).join('')}</select></div>
 <button class="btn alt" data-shot="s" style="width:100%;margin-bottom:10px">📷 حفظ الترتيب كصورة</button>
 <div class="tophd"><div class="yr">2026<br>2027</div><div class="ttl"><b>الترتيب</b><span>${cat} · مجموعة وسط غرب</span></div><img class="lgimg" src="${LEAGUE}" alt=""></div>
 <div class="subl">بعد نهاية الجولة ${String(up).padStart(2,'0')}</div>
 <div class="thd"><span>#</span><span>الفريق</span><span>لعب</span><span>فاز</span><span>تعادل</span><span>خسر</span><span>نقاط</span></div>
 ${rows.map((r,i)=>`<div class="tr${me&&me.teamId==r.id?' me':''}"><span class="rk ${rc(i)}">${i+1}</span><span class="nm">${lg(r.id)}<span>${esc(T[r.id])}</span></span><b class="c">${r.p}</b><b class="c">${r.w}</b><b class="c">${r.d}</b><b class="c">${r.l}</b><b class="c p">${r.pts}</b></div>`).join('')}
 <div class="lgd"><span style="background:#1a1f5e">المتصدر</span><span style="background:#22a84a">المركزان 2 و3</span><span style="background:#0f6b3a">المراكز الوسطى</span><span style="background:#e31e24">المراكز الأخيرة</span></div>
 <div class="foot">الرابطة الجهوية لكرة القدم · تيبازة · ESM<small>esmesselmoune.onrender.com</small></div>
 <p style="font-size:12px;color:var(--mu);text-align:center">الترتيب بالنقاط ثم فارق الأهداف ثم الأهداف المسجلة · النتائج المعتمدة فقط</p>`
}
/* ---- حفظ كصورة ---- */
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
function rrect(x,X,Y,w,h,r,f,s){x.beginPath();x.roundRect(X,Y,w,h,r);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=3;x.stroke()}}
function txt(x,s,X,Y,f,c,al){x.font=f+' Tajawal,system-ui,sans-serif';x.fillStyle=c;x.textAlign=al||'center';x.textBaseline='middle';x.fillText(s,X,Y)}
async function saveCanvas(cv,name){
 const b=await new Promise(r=>cv.toBlob(r,'image/png')),f=new File([b],name,{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()
}
async function poster(kind){
 const W=1080,rows=kind==='s'?tbl(cat,up):pairs(round).m,rh=kind==='s'?96:150,H=(kind==='s'?286:210)+rows.length*rh+170;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.direction='rtl';
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10301f');g.addColorStop(1,'#07110b');x.fillStyle=g;x.fillRect(0,0,W,H);
 const im={};await Promise.all(Object.keys(LG).map(async i=>im[i]=await loadImg(LG[i])));const L=await loadImg(LEAGUE);
 const dl=(id,X,Y,s)=>{if(im[id])x.drawImage(im[id],X-s/2,Y-s/2,s,s)};
 rrect(x,40,40,170,120,26,'#fff');txt(x,'2026',125,80,'900 38px','#1a1f5e');txt(x,'2027',125,125,'900 38px','#1a1f5e');
 rrect(x,230,40,620,120,50,'#1f3f8f');
 txt(x,kind==='s'?'الترتيب':'نتائج الجولة '+round,540,82,'900 52px','#fff');
 txt(x,kind==='s'?cat+' · مجموعة وسط غرب · بعد الجولة '+up:cat+' · '+(round<=11?'ذهاب':'إياب'),540,132,'600 26px','#dbe6ff');
 if(L){x.save();x.beginPath();x.arc(950,100,62,0,7);x.clip();x.drawImage(L,888,38,124,124);x.restore()}
 x.beginPath();x.arc(950,100,62,0,7);x.strokeStyle='#b87333';x.lineWidth=5;x.stroke();
 let y=210;
 if(kind==='s'){
  rrect(x,40,y,1000,56,28,'#12301f');['#','الفريق'].forEach((s,i)=>txt(x,s,i?700:990,y+28,'700 24px','#9bb0a3'));
  [['لعب',300],['فاز',240],['تعادل',180],['خسر',120],['نقاط',60]].forEach(([s,X])=>txt(x,s,X,y+28,'700 22px','#9bb0a3'));y+=76;
  const n=rows.length;
  rows.forEach((r,i)=>{const cy=y+i*rh+rh/2,col=i==0?'#1a1f5e':i==1?'#f2b632':i==2?'#22a84a':i>=n-3?'#e31e24':'#0f6b3a';
   rrect(x,960,cy-27,60,54,16,col);txt(x,String(i+1),990,cy,'900 30px',i==1?'#222':'#fff');
   rrect(x,345,cy-34,600,68,34,'#fdf8ec','#b87333');dl(r.id,905,cy,54);txt(x,T[r.id],860,cy,'800 30px','#1b2a20','right');
   [r.p,r.w,r.d,r.l,r.pts].forEach((v,j)=>{const X=[300,240,180,120,60][j];x.beginPath();x.arc(X,cy,27,0,7);x.fillStyle='#fdf8ec';x.fill();x.strokeStyle='#b87333';x.lineWidth=3;x.stroke();txt(x,String(v),X,cy,'900 26px',j==4?'#7a1f33':'#1b2a20')})});
  y+=n*rh;
 }else{
  rows.forEach(([h,a],i)=>{const cy=y+i*rh+rh/2,v=S[K(cat,round,h,a)],has=v&&v.sh!==undefined&&v.sh!=='';
   rrect(x,40,cy-62,1000,124,28,'#10241a','#23382b');
   dl(h,960,cy,70);txt(x,T[h],905,cy,'800 30px','#fff','right');dl(a,120,cy,70);txt(x,T[a],175,cy,'800 30px','#fff','left');
   rrect(x,430,cy-36,220,72,20,'#fdf8ec');x.direction='ltr';txt(x,has?v.sa+' - '+v.sh:'VS',540,cy,'900 40px','#1b2a20');x.direction='rtl'});
  y+=rows.length*rh;
 }
 rrect(x,40,y+30,1000,110,28,'#1f3f8f');txt(x,'الرابطة الجهوية لكرة القدم · تيبازة · ESM',540,y+68,'800 30px','#fff');txt(x,'esmesselmoune.onrender.com',540,y+108,'600 26px','#dbe6ff');
 await saveCanvas(cv,(kind==='s'?'ترتيب-':'جولة'+round+'-')+cat+'.png')
}
function admin(){
 const row=u=>`<div class="card u"><div><b>${esc(u.name)}</b><br><small>${esc(T[u.teamId]||'')} · <a href="tel:${esc(u.phone)}">${esc(u.phone)}</a></small></div><div class="act" style="margin:0">${u.status!=='approved'?`<button class="btn sm" data-u="${u.id}" data-s="approved">✅ اعتماد</button>`:''}${u.status!=='suspended'?`<button class="btn sm red" data-u="${u.id}" data-s="suspended">⏸ ${u.status==='pending'?'رفض':'تجميد'}</button>`:''}</div></div>`;
 const pend=U.filter(u=>u.status==='pending'),oth=U.filter(u=>u.status!=='pending');
 return`<h2>⏳ بانتظار الموافقة (${pend.length})</h2>${pend.map(row).join('')||'<div class="card" style="color:var(--mu)">لا توجد طلبات</div>'}<h2>👥 الحسابات (${oth.length})</h2>${oth.map(row).join('')||'<div class="card" style="color:var(--mu)">لا توجد حسابات</div>'}<h2>🧰 أدوات</h2><div class="card"><button class="btn alt" id="seed" style="width:100%">استيراد نتائج الجولات 1-3 السابقة</button></div>`
}

/* ---- أحداث ---- */
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;round=firstOpen();up=0;draw()}
 else if(b.dataset.r){round=+b.dataset.r;draw()}
 else if(b.dataset.t){tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}
 else if(b.dataset.shot)poster(b.dataset.shot)
 else if(b.dataset.e)openEdit(b.dataset.e)
 else if(b.dataset.ok)setSt(b.dataset.ok,'confirmed')
 else if(b.dataset.no)setSt(b.dataset.no,'disputed')
 else if(b.dataset.u)try{await db.collection('users').doc(b.dataset.u).update({status:b.dataset.s})}catch(x){toast('⛔ تعذر التنفيذ')}
 else if(b.id==='seed')importSeed()
});
document.addEventListener('change',e=>{if(e.target.id==='rs'){round=+e.target.value;draw()}if(e.target.id==='us'){up=+e.target.value;draw()}});
$('out').onclick=()=>auth.signOut();
$('tl').onclick=()=>{$('fl').hidden=false;$('fr').hidden=true;$('tl').setAttribute('aria-pressed',true);$('tr').setAttribute('aria-pressed',false)};
$('tr').onclick=()=>{$('fl').hidden=true;$('fr').hidden=false;$('tr').setAttribute('aria-pressed',true);$('tl').setAttribute('aria-pressed',false)};
$('bl').onclick=async()=>{say('le','');const m=mail($('lu').value),p=$('lp').value;if(!m||!p)return say('le','⚠️ أدخل رقم الهاتف وكلمة المرور');if(!auth)return;try{await auth.signInWithEmailAndPassword(m,p);$('lp').value=''}catch(x){say('le',errTxt(x))}};
$('lp').onkeydown=e=>{if(e.key==='Enter')$('bl').click()};
$('br').onclick=async()=>{
 say('re','');const n=$('rn').value.trim(),p=$('rp').value.trim(),w=$('rw').value;
 if(!n||ph(p).length<9)return say('re','⚠️ أدخل الاسم ورقم هاتف صحيحاً');
 if(w.length<6)return say('re','⚠️ كلمة المرور قصيرة');if(w!==$('rc').value)return say('re','⚠️ كلمتا المرور غير متطابقتين');
 if(!auth)return;reg=true;
 try{const c=await auth.createUserWithEmailAndPassword(ph(p)+'@esm.local',w);
  await db.collection('users').doc(c.user.uid).set({name:n,phone:p,teamId:+$('rt').value,role:'manager',status:'pending',perm:'full',date:new Date().toISOString().slice(0,10)});
  await auth.signOut();['rn','rp','rw','rc'].forEach(i=>$(i).value='');$('tl').click();say('le','✅ تم إرسال طلبك. بعد اعتماد المشرف يمكنك الدخول.')}
 catch(x){say('re',errTxt(x))}
 reg=false
};
function openEdit(k){
 const m=/^(?:([A-Z0-9]+)\|)?(\d+):(\d+)-(\d+)$/.exec(k);cur={k,h:+m[3],a:+m[4]};const v=S[k]||{};
 $('dt').textContent=T[cur.h]+' ضد '+T[cur.a];$('sh').value=v.sh??'';$('sa').value=v.sa??'';$('sd').value=v.date||'';$('dg').showModal()
}
$('dc').onclick=()=>$('dg').close();
$('ds').onclick=async()=>{
 const x=$('sh').value,y=$('sa').value;if(x===''||y===''||+x<0||+y<0)return toast('⚠️ أدخل نتيجة صحيحة');
 const adm=me.role==='admin',old=S[cur.k]||{};
 const data=Object.assign({},old,{sh:+x,sa:+y,date:$('sd').value,status:adm?'confirmed':'pending_confirm',enteredBy:adm?'admin':me.teamId});
 await put(cur.k,cur.h,cur.a,data);$('dg').close()
};
async function put(k,h,a,data){try{await db.collection('scores').doc(k.replace('|','_')).set({key:k,home:h,away:a,data,by:me.uid});toast('✅ تم الحفظ')}catch(e){toast('⛔ رُفض الحفظ: لا تملك الصلاحية')}}
function setSt(k,st){const m=/^(?:[A-Z0-9]+\|)?\d+:(\d+)-(\d+)$/.exec(k);put(k,+m[1],+m[2],Object.assign({},S[k],{status:st,confirmedBy:me.role==='admin'?'admin':me.teamId}))}
async function importSeed(){
 if(!confirm('استيراد '+Object.keys(SEED).length+' نتيجة (الجولات 1-3) كنتائج معتمدة؟'))return;
 const b=db.batch();
 Object.keys(SEED).forEach(k=>{const m=/^(?:[A-Z0-9]+\|)?\d+:(\d+)-(\d+)$/.exec(k),s=SEED[k];
  b.set(db.collection('scores').doc(k.replace('|','_')),{key:k,home:+m[1],away:+m[2],data:{sh:+s[0],sa:+s[1],date:s[2]||'',status:'confirmed',enteredBy:'admin'},by:me.uid})});
 try{await b.commit();toast('✅ تم الاستيراد')}catch(e){toast('⛔ فشل الاستيراد')}
}
init();
</script>
